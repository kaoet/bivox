[package]
name = "kaols"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI：立即模式框架，版本钉死（见 GUI_MIGRATION.md D1/D15）。
# 渲染后端用 glow（OpenGL）：wgpu 30.0.1 + gpu-allocator 0.28 会被 cpal 的
# windows 0.54 依赖拖成错误版本，导致 wgpu-hal 的 DX12 后端无法编译（D9 兜底方案）。
eframe = { version = "=0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "system_fonts",
    "accesskit",
    "clipboard",
    "links",
    "inspection",
] }
log = "0.4"
chrono = "0.4"

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
cpal = "0.15"
ringbuf = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
# clap / colored 仅供 M4 的调试 CLI（主程序不再使用 clap）
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"
uuid = { version = "1.10", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
sha2 = "0.10"
hex = "0.4"
crossbeam-channel = "0.5"
hound = "3.5"
rubato = "5.0.1"
audioadapter = "5.0.0"
audioadapter-buffers = "5.2.0"
