[package]
name = "bivox"
version = "0.1.2"
edition = "2024"
default-run = "bivox"
description = "超低延迟 VRChat 语音识别、翻译与语音合成"
license = "MIT OR Apache-2.0" # 双许可，二选一，见 LICENSE-MIT / LICENSE-APACHE
repository = "https://github.com/kaoet/bivox"
readme = "README.md"
rust-version = "1.95" # MSRV，见 CONTRIBUTING 第 1 节
keywords = ["vrchat", "speech-to-text", "text-to-speech", "translation", "wasapi"]
categories = ["multimedia::audio", "gui"]
# 桌面应用，不发布到 crates.io
publish = false

[features]
# 渲染后端二选一：默认 wgpu（DX12，远程桌面也能用）。
# 需要 `EFRAME_SCREENSHOT_TO` 截图核对时改用：
#   cargo run --no-default-features --features renderer-glow
default = ["renderer-wgpu"]
renderer-wgpu = ["eframe/wgpu"]
renderer-glow = ["eframe/glow"]

[dependencies]
# GUI：立即模式框架，版本钉死（见 docs/decisions.md D1/D15）。
# 两个后端共用这些基础特性；渲染后端由上面的 feature 决定。
eframe = { version = "=0.37.0", default-features = false, features = [
    "default_fonts",
    "system_fonts",
    "accesskit",
    "clipboard",
    "links",
    "inspection",
] }
log = "0.4"
chrono = "0.4"

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
cpal = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
# clap / colored 仅供调试 CLI（src/bin/admin.rs、src/bin/vad_debug.rs），GUI 主程序不用
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"
uuid = { version = "1.10", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
sha2 = "0.10"
hex = "0.4"
hound = "3.5"
rubato = "5.0.1"
audioadapter-buffers = "5.2.0"
# 音色编辑器选择样例音频文件（Windows 原生文件对话框）
rfd = "0.17"
# VRChat OSC 聊天框：只用来编码 /chatbox/input、/chatbox/typing（见 src/osc.rs）
rosc = "0.11"
# 本地 VAD：Silero VAD ONNX 推理（ort；pyke 预编译包把 ONNX Runtime 静态链接进 exe）
ort = "=2.0.0-rc.15"

# 单实例：按 exe 路径哈希创建命名 Mutex（仅 Windows 需要）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# 进程环回采集（VRChat 对方语音，D36）：ActivateAudioInterfaceAsync + PROCESS_LOOPBACK。
# windows 0.62 已经由 wgpu 30 引入，这里只是把它变成直接依赖，不新增版本。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.62"

[build-dependencies]
# 把 assets/bivox.ico 写进 exe 资源（资源管理器/任务栏里的文件图标）
winres = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
