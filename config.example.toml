# ============================================================
# kaols 默认配置模板
#
# 本文件是「默认配置模板」：kaols.exe 首次启动时会在 exe 同目录生成 config.toml，
# 内容与本文件完全一致（模板已编译进程序，本文件仅供开发参考，不随发布包分发）。
#
# 读取规则（便携模式）：
#   - 只读取 exe 所在目录的 config.toml；
#   - 不读取 %APPDATA%、不读取当前工作目录、不读取环境变量。
# 未写出的字段使用内置默认值；未知字段会导致解析失败。
# 注意：config.toml 含 API Key，已被 .gitignore 忽略；不要提交，也不要随便分享整个程序目录。
# ============================================================

[api]
# 百炼 API Key，必填。获取地址：https://bailian.console.aliyun.com/
# 首次启动后可在程序的「设置」页填写，或直接取消下面这行的注释后点「重新加载配置」。
# key = "sk-your-dashscope-api-key-here"

# 百炼接入域名 Host：只填写纯 host，不要带 wss:// 前缀、路径或端口，否则启动会报错。
# 默认使用百炼通用域名 dashscope.aliyuncs.com；
# 如使用业务空间专属域名（{WorkspaceId}.cn-beijing.maas.aliyuncs.com），在此覆盖。
# workspace_host = "dashscope.aliyuncs.com"

[asr]
# 实时识别模型，默认 qwen-audio-3.1-asr-flash-streaming
# model = "qwen-audio-3.1-asr-flash-streaming"

# 用户可能说的语言列表（有序）：
#   - 只写一个元素 = 强提示只按该语言识别（例如 ["ja"]）；
#   - 支持的代码见 README（zh/ja/ko/en/fr/de/...，ASR 的 tl 与复刻的 fil 会自动归一）。
#   - 整份列表会作为 ASR 的 language_hints 提示（服务端只使用前 4 个）；
#     本地语言判定仍使用完整列表。
# languages = ["zh"]

# 预编译热词：人名、产品名、行业术语等，用来提升识别准确率。
#   - 数组，每项一个词条；权重固定 50（百炼「超级热词」档位，实测召回更好），不限定语种，无需在这里写权重；
#   - 开始实时会话时会自动上传到百炼并创建/复用「预编译热词列表」，
#     vocabulary_id 保存在 [cache] file 指向的 cache.json 中；
#   - 修改后需要重新开始会话生效；百炼建议两次热词更新至少间隔 5 分钟；
#   - 仅主业务空间支持热词；每账号最多 50 个列表；固定使用超级热词权重 50，每列表最多 50 条；
#     单条热词：含非 ASCII 字符时不超过 15 个字符，纯 ASCII 时不超过 7 个空格分隔片段。
#   - 留空 = 不使用热词，也不会访问热词接口。
# hotwords = ["原神", "崩坏：星穹铁道", "Kaoet"]

[tts]
# 合成模型，默认 qwen-audio-3.1-tts-flash（低延迟实时流式合成）
# model = "qwen-audio-3.1-tts-flash"

# 当前音色，支持三种写法：
#   1. 系统音色名（默认 qiaoxiaojiao_v3.1）
#   2. 百炼复刻音色 voice_id
#   3. custom:<配置名>，引用下面的 [tts.custom_voices.<配置名>]（支持多语言声线样本）
# 音色与模型绑定，不能跨模型混用。
# voice = "qiaoxiaojiao_v3.1"

# 中文方言（默认普通话 = 不附加方言指令）。
# 只影响判定为中文的句子：非普通话时合成请求会附带 instruction「请讲<方言>。」；
# 可用值（官方方言名，只认这些写法，不支持「粤语」等别名）：
#   普通话 广东话 重庆话 东北话 甘肃话 贵州话 浙江话 河北话 河南话 湖北话
#   湖南话 江西话 宁波话 宁夏话 青岛话 陕西话 山西话 山东话 上海话 四川话 云南话
# 实际效果取决于音色是否支持方言指令：复刻音色支持全部 20 种；qwen-audio-3.1-tts-flash
# 的 4 个多语种/方言系统音色仅支持上海、广东、东北、重庆、陕西、云南、宁波、甘肃 8 种，
# 其余系统音色可能只支持普通话。
# dialect = "普通话"

# 删除缓存文件只会导致下次重新上传复刻；缓存位置见文件后面的 [cache] 段。

# ------------------------------------------------------------
# 自定义（复刻）音色：一个音色可以有多份不同语言的声线样本
#
# 每个样本都会按（当前 tts.model, 音频内容）单独复刻并缓存一个 voice_id。
# 合成时按 ASR 文本判定本句语言：
#   - 有该语言样本 → 用该语言的声线；
#   - 没有该语言样本 → 回退到 samples 的第一个（默认声线）；
# 同时合成请求始终携带目标语言的 language_hints；
# 有内置映射的非中英语种（ja/ko/fr/de/ru/es/pt/it/th/vi/id/ms/fil/ar）会附带 instruction；
# 中文句子则按 [tts] dialect 附带方言指令（普通话不附加）。
#
# 每个样本可单独设置合成语速 rate：
#   - 默认 1.0，范围 0.5~2.0；同一音色的不同语言声线可以不同；
#   - 合成时用本句所选样本的 rate，回退默认样本时用该样本的 rate；
#   - 内置音色/普通 voice_id 固定 1.0；语速不参与复刻/缓存，改它不会重新上传音频。
#
# 注意 TOML 顺序：先写父表 [tts.custom_voices.<名字>]，再写 [[...samples]]。
# 配置键名（如 edgar）会自动派生百炼音色前缀：去掉非字母数字、转小写；
# 多语言样本追加语言代码（如 edgarzh / edgarja），单语言直接使用。
# 建议配置键名使用 ASCII 小写字母/数字（非 ASCII 键名净化后可能为空，回退 voice 或只剩语言代码）。
# 样例音频要求：清晰单说话人、至少约 5 秒（推荐 10~20 秒，单条建议不超过 60 秒，≤10 MB），
# 可用 wav/mp3/m4a，尽量无背景音乐；复刻时只取前 20 秒（max_prompt_audio_length，D30）。
#
# [tts.custom_voices.edgar]
# name = "异环 - 埃德嘉"      # 可选，显示名（默认用配置名）
#
# [[tts.custom_voices.edgar.samples]]
# language = "zh"             # 必填，该样本语言（zh/ja/ko/en/...）
# audio = "samples/edgar-zh.wav"
# rate = 1.0                  # 可选，该样本合成语速（0.5~2.0，默认 1.0）
#
# [[tts.custom_voices.edgar.samples]]
# language = "ja"
# audio = "samples/edgar-ja.wav"
# rate = 1.0

[cache]
# 本地共享缓存文件（相对本配置文件所在目录），保存两类互不影响的记录：
#   - 自定义音色：TTS 模型 → 样例音频内容 SHA256 → voice_id；
#     同一模型下同一音频只复刻一次，切换模型不会覆盖其它模型的记录；
#   - ASR 预编译热词：ASR 模型 → vocabulary_id + 热词快照；
#     首次开始会话时自动创建并写入，之后复用/更新。
# 删除该文件只会导致下次重新复刻音色、重建热词列表。
# file = "cache.json"

[audio]
# 不填 = 系统默认设备。GUI 从下拉框选择后写入**完整设备名**，启动时按精确名称匹配；
# 设备改名/被拔掉时会明确报错，不会静默回退到默认设备。
# input_device = "Microphone (USB Audio)"
# output_device = "CABLE Input (VB-Audio Virtual Cable)"

[vad]
# 本地 VAD 门控：只上传语音段，节省 ASR 费用（默认开启）
# enabled = true
# 起音阈值 = 噪声底 + margin_db（dB）
# margin_db = 9.0
# 语音结束后拖尾保持（毫秒）
# hangover_ms = 500
# 句末补发的尾部静音（毫秒），用于触发服务端 sentence_end
# tail_ms = 1000
# 打印每个 chunk 的 VAD 电平/阈值/发送决策，用于现场标定
# debug = false

[chunking]
# 投机分块词数阈值
# words = 6

[translate]
# 翻译模式（默认关闭）：开启后输入先翻成目标语言，再合成目标语言语音，字幕显示「译文 + 原文」。
# 可在 GUI「翻译」页修改 enabled/target/granularity/show_source；model 只读，需手改本段后「重新加载配置」。
# enabled = false
# 目标语言（TTS 支持的 16 种）：zh/en/fr/de/ja/ko/ru/pt/th/id/vi/es/it/ms/fil/ar
# target = "en"
# 翻译模型
# model = "qwen-mt-flash"
# 翻译粒度：clause = 有标点/句终就翻（延迟低）；sentence = 整句结束再翻（质量优先）
# granularity = "clause"
# 字幕是否显示原文行；关掉只显示译文（GUI 改后立即生效，不重启会话）
# show_source = true

[vrchat.osc]
# 是否把实时字幕发送到 VRChat 的 OSC 聊天框（默认关闭）。
# 使用前需在 VRChat 中开启 OSC：Action Menu → Options → OSC → Enabled。
# 发送地址固定为本机 127.0.0.1；端口需与 VRChat 的 OSC 接收端口一致（默认 9000）。
# 文本发送间隔固定 1 秒；typing 指示器不占文本限流；句终后约 30 秒由 VRChat 自然过期。
# enabled = false

# 若用 VRChat 启动参数改过接收端口（--osc=inPort:senderIP:outPort），这里填相同的 inPort。
# port = 9000

# 翻译模式下的显示内容（仅翻译模式生效；非翻译模式始终显示 ASR 原文）：
#   "source"      = 只显示原文
#   "bilingual"   = 显示原文和译文（译文在前、原文在后）
#   "translation" = 只显示译文
# display = "bilingual"
